# Builds the Google TV score bug app (overlay-tv/) and publishes the APK
# as the "scorebug-latest" release, so there's one fixed place to grab
# it from: Releases → scorebug-latest → scorebug.apk (+ scorebug-toggle.apk,
# the remote-button on/off shortcut).
name: Score Bug APK

on:
  push:
    paths:
      - "overlay-tv/**"
      - ".github/workflows/scorebug-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overlay-tv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME) with
      # licenses accepted, so no setup-android step is needed.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk scorebug.apk
          cp toggle/build/outputs/apk/debug/toggle-debug.apk scorebug-toggle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: scorebug-apk
          path: |
            overlay-tv/scorebug.apk
            overlay-tv/scorebug-toggle.apk
      - name: Publish scorebug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scorebug-latest --yes --cleanup-tag || true
          gh release create scorebug-latest scorebug.apk scorebug-toggle.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Score Bug (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install: adb install -r scorebug.apk, then adb install -r scorebug-toggle.apk (remote-button shortcut)"
