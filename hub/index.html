<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YCPR Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens mirror YCPR's admin shell (src/styles/admin.css): Inter + Anton, navy + gold. */
  :root {
    --a-bg:#f4f5f9; --a-surface:#ffffff; --a-inset:#f7f8fb; --a-line:#e1e3ec; --a-row:#eef0f5;
    --a-ink:#16172e; --a-ink-2:#4d5070; --a-muted:#6e7294; --a-accent:#3b3d8f; --a-accent-soft:#ecedfa;
    --a-hover:#f6f7fb; --a-field:#ffffff; --a-field-line:#cfd3df; --a-focus:#8babe4;
    --a-primary:#1f2041; --a-primary-ink:#ffffff; --a-shadow:0 1px 2px rgba(20,22,50,.05);
    --side:#1f2041; --side-ink:#d9def0; --side-dim:#8babe4; --side-hover:#2a2b52; --side-active:#4b3f72; --gold:#ffc857;
    --c-ok:#157a3a; --c-ok-bg:#e5f4ea; --c-err:#b4282e; --c-err-bg:#fbe8e8; --c-warn:#8a5a00; --c-warn-bg:#fff3d6; --c-info:#2f4fa6; --c-info-bg:#e8eefb;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --a-bg:#1f2041; --a-surface:#292a52; --a-inset:#24254b; --a-line:#3a3a63; --a-row:#32335e;
    --a-ink:#f4f2ea; --a-ink-2:#c2c6e4; --a-muted:#8babe4; --a-accent:#ffc857; --a-accent-soft:#3a3270;
    --a-hover:#2f3060; --a-field:#23244a; --a-field-line:#4a4c80; --a-focus:#ffc857;
    --a-primary:#ffc857; --a-primary-ink:#1f2041; --a-shadow:none; --side:#16172e; --side-hover:#23244a;
    --c-ok:#8fd39a; --c-ok-bg:rgba(63,185,80,.16); --c-err:#ff8a80; --c-err-bg:rgba(248,81,73,.16); --c-warn:#ffd27a; --c-warn-bg:rgba(255,200,87,.14); --c-info:#a9c1ff; --c-info-bg:rgba(120,150,255,.16);
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--a-bg); color:var(--a-ink); font:14px/1.45 Inter, system-ui, sans-serif; }
  button, input, select { font:inherit; color:inherit; }
  .num { font-variant-numeric:tabular-nums; }
  .ok { color:var(--c-ok); } .bad { color:var(--c-err); } .muted { color:var(--a-muted); }

  /* Shell */
  .shell { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:100vh; }
  .side { background:var(--side); color:var(--side-ink); position:sticky; top:0; height:100vh; padding:16px 12px; display:flex; flex-direction:column; gap:16px; }
  .brand { display:flex; align-items:center; gap:9px; padding:2px 6px; }
  .brand i { width:30px; height:30px; border-radius:8px; background:var(--gold); color:#1f2041; font:400 .95rem Anton, Impact, sans-serif; font-style:normal; display:grid; place-items:center; }
  .brand b { display:block; font:400 1.05rem Anton, Impact, sans-serif; letter-spacing:.04em; color:#fff; line-height:1; }
  .brand small { display:block; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--side-dim); margin-top:3px; }
  .nav { display:grid; gap:2px; }
  .nav button { display:flex; justify-content:space-between; align-items:center; width:100%; padding:7px 9px; border:0; border-radius:6px; background:none; color:var(--side-ink); text-align:left; cursor:pointer; font-size:.88rem; }
  .nav button:hover { background:var(--side-hover); color:#fff; }
  .nav button.on { background:var(--side-active); color:var(--gold); font-weight:600; }
  .nav .count { background:var(--gold); color:#1f2041; border-radius:999px; font-size:.68rem; padding:0 7px; font-weight:800; }
  .side-foot { margin-top:auto; border-top:1px solid var(--side-hover); padding-top:10px; display:grid; gap:6px; font-size:.78rem; color:var(--side-dim); }
  .side-foot button { background:none; border:1px solid var(--side-hover); color:var(--side-ink); border-radius:7px; padding:5px 9px; cursor:pointer; }

  .main { min-width:0; display:flex; flex-direction:column; }
  .top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:10px 24px; min-height:56px; background:var(--a-surface); border-bottom:1px solid var(--a-line); }
  .top h1 { font:400 1.5rem Anton, Impact, sans-serif; text-transform:uppercase; letter-spacing:.02em; margin:0 auto 0 0; }
  .content { padding:20px 24px 64px; min-width:0; }
  .mobile-tabs { display:none; }

  /* Building blocks */
  .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:8px; border:1px solid var(--a-field-line); background:var(--a-surface); color:var(--a-ink); font-weight:600; font-size:.84rem; cursor:pointer; box-shadow:var(--a-shadow); }
  .btn:hover { background:var(--a-hover); border-color:var(--a-accent); }
  .btn.primary { background:var(--a-primary); border-color:var(--a-primary); color:var(--a-primary-ink); }
  .btn.danger { background:var(--c-err); border-color:var(--c-err); color:#fff; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--a-row); color:var(--a-ink-2); white-space:nowrap; }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.75; }
  .pill.ok { background:var(--c-ok-bg); color:var(--c-ok); } .pill.bad { background:var(--c-err-bg); color:var(--c-err); }
  .pill.warn { background:var(--c-warn-bg); color:var(--c-warn); } .pill.info { background:var(--c-info-bg); color:var(--c-info); }
  .panel { background:var(--a-surface); border:1px solid var(--a-line); border-radius:12px; padding:16px 18px; box-shadow:var(--a-shadow); min-width:0; }
  .panel h3 { margin:0 0 10px; font-size:.98rem; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--a-surface); border:1px solid var(--a-line); border-radius:12px; padding:12px 14px; box-shadow:var(--a-shadow); min-width:0; }
  .stat .l { color:var(--a-ink-2); font-size:.76rem; }
  .stat .v { font-size:1.4rem; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; letter-spacing:-.01em; white-space:nowrap; }
  .stat .d { font-size:.74rem; color:var(--a-muted); }
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--a-line); margin:0 0 14px; flex-wrap:wrap; }
  .tabs button { padding:8px 14px; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; background:none; color:var(--a-ink-2); font-weight:600; font-size:.88rem; cursor:pointer; }
  .tabs button.on { color:var(--a-ink); border-color:var(--gold); }
  .seg { display:inline-flex; border:1px solid var(--a-field-line); border-radius:8px; overflow:hidden; }
  .seg button { padding:6px 12px; border:0; border-right:1px solid var(--a-field-line); background:var(--a-field); color:var(--a-ink-2); font-weight:600; font-size:.8rem; cursor:pointer; }
  .seg button:last-child { border-right:0; } .seg button.on { background:var(--a-primary); color:var(--a-primary-ink); }
  .field { display:grid; gap:3px; font-size:.74rem; font-weight:600; color:var(--a-ink-2); }
  .field input, .field select { padding:6px 10px; border:1px solid var(--a-field-line); border-radius:8px; background:var(--a-field); color:var(--a-ink); min-height:32px; outline:none; width:100%; }
  .field input:focus, .field select:focus { border-color:var(--a-focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--a-focus) 30%, transparent); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px 12px; }
  input[type=range] { accent-color:var(--a-accent); width:100%; }
  input[type=checkbox] { accent-color:var(--a-accent); width:16px; height:16px; }
  .callout { border-left:3px solid var(--c-warn); background:var(--c-warn-bg); padding:8px 12px; border-radius:6px; font-size:.84rem; margin:0 0 12px; }
  .err { color:var(--c-err); }

  /* Tables */
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:.86rem; }
  th { text-align:right; color:var(--a-muted); font-weight:600; font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; padding:7px 8px; border-bottom:1px solid var(--a-line); white-space:nowrap; }
  td { text-align:right; padding:7px 8px; border-bottom:1px solid var(--a-row); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  tr:last-child td { border-bottom:0; }
  .scroll { overflow-x:auto; }

  /* Board: one row per game */
  .board { background:var(--a-surface); border:1px solid var(--a-line); border-radius:12px; box-shadow:var(--a-shadow); overflow:hidden; }
  .brow { display:grid; grid-template-columns:minmax(170px,1.5fr) 118px 132px 110px 116px 110px 112px; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--a-row); cursor:pointer; }
  .brow:last-child { border-bottom:0; }
  .brow:hover { background:var(--a-hover); }
  .brow.head { cursor:default; background:var(--a-surface); color:var(--a-muted); font-size:.66rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase; padding-top:8px; padding-bottom:8px; border-bottom:1px solid var(--a-line); }
  .brow.head:hover { background:var(--a-surface); }
  .brow.off { opacity:.55; }
  .lean .pill { max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .game b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .game span { font-size:.76rem; color:var(--a-muted); }
  .lines { font-size:.8rem; line-height:1.35; font-variant-numeric:tabular-nums; }
  .lines em { font-style:normal; color:var(--a-muted); display:inline-block; width:44px; }
  .r { text-align:right; font-variant-numeric:tabular-nums; }
  .r small { display:block; color:var(--a-muted); font-size:.72rem; }
  .spark svg { display:block; }
  .empty { padding:28px; text-align:center; color:var(--a-muted); }

  /* Drawer */
  .scrim { position:fixed; inset:0; background:rgba(15,16,40,.35); z-index:40; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(640px,100%); background:var(--a-bg); z-index:41; display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(15,16,40,.25); }
  .drawer-head { display:flex; align-items:flex-start; gap:10px; padding:16px 18px 10px; background:var(--a-surface); border-bottom:1px solid var(--a-line); }
  .drawer-head h2 { font:400 1.35rem Anton, Impact, sans-serif; text-transform:uppercase; letter-spacing:.02em; margin:0; line-height:1.1; }
  .drawer-body { padding:14px 18px 40px; overflow-y:auto; }
  .xbtn { margin-left:auto; border:1px solid var(--a-line); background:var(--a-surface); border-radius:8px; width:32px; height:32px; cursor:pointer; color:var(--a-ink-2); }
  .mini-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
  .mini-stats .stat { padding:9px 10px; } .mini-stats .stat .v { font-size:1.05rem; }
  svg text { fill:var(--a-muted); font-size:10px; font-family:Inter, sans-serif; }

  /* Gate */
  .gate { min-height:100vh; display:grid; place-items:center; background:var(--side); padding:24px 16px; }
  .gate-card { width:100%; max-width:380px; display:grid; gap:14px; background:var(--a-surface); border-radius:16px; padding:28px 26px 22px; box-shadow:0 20px 50px rgba(0,0,0,.25); }

  @media (max-width: 900px) {
    .shell { grid-template-columns:minmax(0,1fr); }
    .side { display:none; }
    .top { padding:10px 14px; }
    .top h1 { font-size:1.2rem; }
    .mobile-tabs { display:flex; gap:2px; overflow-x:auto; padding:0 10px; background:var(--a-surface); border-bottom:1px solid var(--a-line); position:sticky; top:56px; z-index:19; }
    .mobile-tabs button { padding:9px 12px; border:0; border-bottom:2px solid transparent; background:none; color:var(--a-ink-2); font-weight:600; white-space:nowrap; cursor:pointer; }
    .mobile-tabs button.on { color:var(--a-ink); border-color:var(--gold); }
    .content { padding:14px 12px 48px; }
    .brow { grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"game status" "lines ev" "spark risk"; row-gap:6px; }
    .brow.head { display:none; }
    .brow > .game { grid-area:game; } .brow > .st { grid-area:status; justify-self:end; }
    .brow > .lines { grid-area:lines; } .brow > .ev { grid-area:ev; }
    .brow > .spark { grid-area:spark; } .brow > .risk { grid-area:risk; }
    .brow > .lean { display:none; }
    .mini-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (prefers-reduced-motion: no-preference) { .drawer { animation:slide .18s ease-out; } @keyframes slide { from { transform:translateX(24px); } } }
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <form id="gateForm" class="gate-card">
    <div class="brand"><i>YC</i><div><b style="color:var(--a-ink)">YCPR BOT</b><small style="color:var(--a-muted)">Kalshi ladder · paper</small></div></div>
    <label class="field">Dashboard password<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn primary" style="justify-content:center">Open</button>
    <p id="gateErr" class="err" style="margin:0"></p>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand"><i>YC</i><div><b>YCPR BOT</b><small>Kalshi ladder</small></div></div>
    <nav class="nav" id="nav">
      <button data-view="board" class="on">Board <span class="count" id="navCount">0</span></button>
      <button data-view="fills">Fills</button>
      <button data-view="add">Add game</button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="side-foot">
      <span id="sideRun">–</span>
      <button id="themeBtn" type="button">Dark theme</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title">Board</h1>
      <span id="modePill" class="pill info">Paper</span>
      <button id="killBtn" class="btn" type="button">Kill switch</button>
    </header>
    <nav class="mobile-tabs" id="mtabs">
      <button data-view="board" class="on">Board</button>
      <button data-view="fills">Fills</button>
      <button data-view="add">Add game</button>
      <button data-view="settings">Settings</button>
    </nav>
    <main class="content">
      <p id="err" class="err"></p>
      <section data-pane="board"></section>
      <section data-pane="fills" hidden></section>
      <section data-pane="add" hidden>
        <form id="addForm" class="panel">
          <h3>Add a game</h3>
          <div class="grid2">
            <label class="field" style="grid-column:1/-1">Game (next 8 days)<select id="addGame" required></select></label>
            <label class="field">Lean toward<select id="addPick"></select></label>
            <label class="field">YC line (away)<input id="addYc" readonly placeholder="pick a game"></label>
            <label class="field">Override away spread<input id="addOverride" type="number" step="0.1" placeholder="blank = use YC"></label>
            <label class="field">Trust in your number<select id="addTrust"><option value="">Use default</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="0.25">25%</option></select></label>
            <label class="field">Max loss on game ($)<input id="addMax" type="number" step="0.5" value="5"></label>
            <label class="field">Contracts per number<input id="addCap" type="number" step="1" value="1"></label>
            <label class="field">Profit target ($)<input id="addTarget" type="number" step="0.5" placeholder="optional"></label>
            <label class="field">Pro-pick edge (¢)<input id="addPro" type="number" step="0.5" value="2"></label>
            <label class="field">Sell-back edge (¢)<input id="addAnti" type="number" step="0.5" value="4"></label>
            <label class="field">Take edge (¢)<input id="addTake" type="number" step="0.5" value="3"></label>
            <label class="field">Extra edge per contract (¢)<input id="addStep" type="number" step="0.5" value="1"></label>
            <label class="field">Stop quoting (min before)<input id="addStop" type="number" step="5" value="30"></label>
          </div>
          <div style="display:flex;gap:10px;align-items:center;margin-top:14px"><button class="btn primary">Add / update</button><span id="addMsg" class="muted"></span></div>
        </form>
      </section>
      <section data-pane="settings" hidden></section>
    </main>
  </div>
</div>
<div id="drawerRoot"></div>
<script src="app.js"></script>
</body>
</html>
